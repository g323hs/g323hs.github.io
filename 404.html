<head>

  <title>George Hildick-Smith</title>
  <meta name="robots" content="noindex" />
  <script>
    // Any other address on this site goes to george-hs.duckdns.org when that site is up, and to the CV
    // on this site when it isn't.
    (function () {
      var img = new Image(), done = false;
      function go(url) { if (done) return; done = true; window.location.replace(url); }
      var timer = setTimeout(function () { go("/"); }, 2500);
      img.onload = function () { clearTimeout(timer); go("https://george-hs.duckdns.org/"); };
      img.onerror = function () { clearTimeout(timer); go("/"); };
      img.src = "https://george-hs.duckdns.org/favicon.svg?check=" + Date.now();
    })();
  </script>

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 24px; color: #1a1a1a; }
    a { color: #2563eb; }
    @media (prefers-color-scheme: dark) { body { background: #111317; color: #f2f2f2; } a { color: #60a5fa; } }
  </style>
</head>
